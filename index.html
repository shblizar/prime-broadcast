<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Basic SEO -->
    <title>Prime Broadcast | Live Streaming & Multi-Camera Broadcast Jakarta</title>

    <meta
      name="description"
      content="Prime Broadcast menyediakan jasa live streaming profesional, multi-camera broadcast, dan dokumentasi video untuk berbagai kebutuhan event di Jakarta dan sekitarnya."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prime Broadcast" />
    <meta
      property="og:title"
      content="Prime Broadcast | Live Streaming & Multi-Camera Broadcast Jakarta"
    />
    <meta
      property="og:description"
      content="Prime Broadcast menyediakan jasa live streaming profesional, multi-camera broadcast, dan dokumentasi video untuk berbagai kebutuhan event di Jakarta dan sekitarnya."
    />
    <meta property="og:url" content="https://primebroadcast.id/" />

    <!-- Ganti dengan file thumbnail yang benar-benar ada -->
    <meta
      property="og:image"
      content="https://primebroadcast.id/thumbnail.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Prime Broadcast | Live Streaming & Multi-Camera Broadcast Jakarta"
    />
    <meta
      name="twitter:description"
      content="Prime Broadcast menyediakan jasa live streaming profesional, multi-camera broadcast, dan dokumentasi video untuk berbagai kebutuhan event di Jakarta dan sekitarnya."
    />
    <meta
      name="twitter:image"
      content="https://primebroadcast.id/thumbnail.png"
    />
  </head>

  <body
    class="bg-[#F7F5F1] text-[#081A2E] antialiased selection:bg-[#A40D35] selection:text-white"
    style="font-family: Helvetica, Arial, sans-serif;"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
